<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Person App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous"
  />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h1 class="mb-4">Person Manager</h1>

    <!-- Form -->
    <div class="card p-3 mb-4">
      <div class="row g-2">
        <div class="col-md-5">
          <input id="nameInput" type="text" class="form-control" placeholder="Enter name" />
        </div>
        <div class="col-md-3">
          <button id="addBtn" class="btn btn-primary w-100">Add Person</button>
        </div>
      </div>
    </div>

    <!-- Person List -->
    <div class="card p-3">
      <h5>People</h5>
      <ul id="personList" class="list-group"></ul>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
